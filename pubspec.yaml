name: maoneart_studio
description: "MaoneArt Studio - AI Photo Editor & Product Studio (Photoroom Alternative) built with Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Image Processing & Manipulation
  image: ^4.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # Networking & AI Background Removal
  http: ^1.2.1
  dio: ^5.4.3+1

  # UI Components & Glassmorphism
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/presets/
